name: run_specific_framework
description: >
  Run a single named analysis framework on the current model and return its findings.
  Use when the user asks for a deep-dive into one framework, or to run a framework
  that the full pipeline may not have selected. Pass the module_id exactly as returned
  in run_analysis output (e.g. "dominant-strategy", "pure-nash", "relational-repair").
  Returns not_applicable if the framework score is below the minimum threshold.
input_schema:
  type: object
  properties:
    module_id:
      type: string
      description: The id of the framework module to run (e.g. "dominant-strategy", "pure-nash").
  required: [module_id]
