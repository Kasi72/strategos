name: ask_user
description: Shows up to 3 short questions as tappable cards. Ends your turn. The user's answer arrives as their next message.
input_schema:
  type: object
  properties:
    questions:
      type: array
      minItems: 1
      maxItems: 3
      items:
        type: object
        properties:
          id: { type: string }
          text: { type: string }
          options: { type: array, items: { type: string }, maxItems: 4 }
          allow_free_text: { type: boolean }
        required: [id, text]
  required: [questions]
