name: infer_opponent_utility
description: >
  Runs inverse utility inference on recorded outcomes to estimate the opponent's underlying
  PayoffDimension weights. Use when the user asks what the other person actually cares about,
  wants a utility breakdown of their counterpart's behaviour, or needs to understand why the
  opponent keeps making surprising moves. Returns opponent_weights: a map from PayoffDimension
  name to inferred weight (0–1 range, sums to 1.0), plus a confidence label (LOW / MEDIUM / HIGH)
  and the sample size used. Requires at least 3 outcomes with a recorded opponent action index;
  returns status "not_enough_data" otherwise.
input_schema:
  type: object
  properties:
    limit:
      type: integer
      description: Maximum number of recent outcomes to use (default 20).
  required: []
