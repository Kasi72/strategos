name: update_memory
description: Store facts (with the user's words in quote), open questions or preferences; resolve items by id.
input_schema:
  type: object
  properties:
    add: { type: array, items: { type: object, properties: { kind: { type: string, enum: [FACT, OPEN_QUESTION, PREFERENCE, DECISION_NOTE] }, text: { type: string }, quote: { type: string } }, required: [kind, text] } }
    resolve: { type: array, items: { type: string } }
  required: []
